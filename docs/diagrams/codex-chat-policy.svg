<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Workbench chat provider policy</title>
  <desc id="desc">Web chat creates Codex sessions and can use Codex-compatible providers. Claude Code and Pi are launched in the terminal and can only be viewed as history.</desc>
  <rect width="1100" height="430" fill="#111827"/>
  <text x="50" y="55" fill="#f9fafb" font-family="Arial, sans-serif" font-size="28" font-weight="700">Workbench chat provider policy</text>
  <rect x="50" y="95" width="430" height="270" rx="18" fill="#1f2937" stroke="#60a5fa" stroke-width="3"/>
  <text x="85" y="140" fill="#93c5fd" font-family="Arial, sans-serif" font-size="23" font-weight="700">Web chat</text>
  <rect x="85" y="170" width="360" height="65" rx="12" fill="#2563eb"/>
  <text x="265" y="210" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="21">Codex interface</text>
  <text x="85" y="275" fill="#d1d5db" font-family="Arial, sans-serif" font-size="18">New sessions and replies</text>
  <text x="85" y="305" fill="#d1d5db" font-family="Arial, sans-serif" font-size="18">Codex-compatible providers allowed</text>
  <path d="M480 230 H620" stroke="#9ca3af" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="620" y="95" width="430" height="270" rx="18" fill="#1f2937" stroke="#f59e0b" stroke-width="3"/>
  <text x="655" y="140" fill="#fbbf24" font-family="Arial, sans-serif" font-size="23" font-weight="700">Terminal history</text>
  <rect x="655" y="170" width="360" height="65" rx="12" fill="#92400e"/>
  <text x="835" y="210" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="21">Claude Code / Pi</text>
  <text x="655" y="275" fill="#d1d5db" font-family="Arial, sans-serif" font-size="18">Launch and continue in terminal</text>
  <text x="655" y="305" fill="#d1d5db" font-family="Arial, sans-serif" font-size="18">Workbench history is read-only</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9ca3af"/></marker></defs>
</svg>
