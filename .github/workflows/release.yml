name: Release
on:
  schedule:
    # 07:00 UTC+08:00, every day.
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and package without creating a tag or release'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Serialize allocation through publication, including manual runs.
  group: release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Select date and next unused counter
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq 'add // []' > "$RUNNER_TEMP/releases.json"
          python3 scripts/plan-release.py --releases "$RUNNER_TEMP/releases.json"
      - name: Stamp a release-only commit
        if: steps.plan.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          source_commit="$(git rev-parse HEAD)"
          python3 scripts/version.py "$RELEASE_VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json dashboard/manifest.json
          git -c core.hooksPath=/dev/null commit --allow-empty -m "chore(release): v$RELEASE_VERSION" -m "Source-Commit: $source_commit"
          echo "RELEASE_SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
        if: steps.plan.outputs.publish == 'true'
      - uses: actions/setup-node@v7
        if: steps.plan.outputs.publish == 'true'
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        if: steps.plan.outputs.publish == 'true'
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Verify, build and test the exact release candidate
        if: steps.plan.outputs.publish == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm version:check
          pnpm typecheck
          pnpm test
          env -u CODEX_APP_SERVER_ENDPOINT -u CODEX_HOME uv run --no-project --with-requirements requirements-dev.txt pytest -q tests
          pnpm build
          pnpm history:check
          pnpm privacy:check
          pnpm release:verify
          pnpm release:package
          pnpm release:smoke
      - name: Publish immutable stable release
        if: steps.plan.outputs.publish == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          cd release
          sha256sum --check SHA256SUMS
          # The candidate is a child of main, reachable only through its release tag.
          # Never push version-only commits to main or overwrite a published tag.
          git tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes --notes "Built from main commit $RELEASE_SOURCE_COMMIT."
          gh release upload "$RELEASE_TAG" ./*.tar.gz SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
      - name: Summarize validation-only run
        if: steps.plan.outputs.publish == 'true' && inputs.dry_run == true
        run: echo 'Dry run passed. No tag or release was created; the counter was not reserved.' >> "$GITHUB_STEP_SUMMARY"
